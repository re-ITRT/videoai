# ============================================================
# APISIX 配置 (Standalone 模式)
# 用于本地 docker-compose 部署
# ============================================================

apisix:
  node_listen: 9080
  enable_admin: false           # 使用 standalone 模式
  enable_dev_mode: false
  ssl:
    enable: false

deployment:
  role: traditional
  role_traditional:
    config_provider: yaml
  admin:
    admin_key:
      - name: admin
        key: edd1c9f034335f136f87ad84b625c8f1  # APISIX default key
        role: admin

# Plugin configuration
plugin_attr:
  jwt-auth:
    access_header: Authorization
    header: Authorization

# Upstreams
upstreams:
  - id: backend
    nodes:
      "backend:8000": 1
    type: roundrobin
    retries: 2
    timeout:
      connect: 5
      send: 10
      read: 60

# Routes
routes:
  - uri: /health
    upstream_id: backend
    methods: ["GET", "HEAD"]
    plugins:
      cors: {}
      response-rewrite:
        headers:
          set:
            X-Video-AI: gateway

  - uri: /api/v1/auth/register
    upstream_id: backend
    methods: ["POST", "OPTIONS"]
    priority: 10
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "POST,OPTIONS"
        allow_headers: "Content-Type,Authorization"
        allow_credential: true
      rate-limit:
        count: 10
        time_window: 60
        key_type: var
        key: remote_addr

  - uri: /api/v1/auth/login
    upstream_id: backend
    methods: ["POST", "OPTIONS"]
    priority: 10
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "POST,OPTIONS"
        allow_headers: "Content-Type,Authorization"
        allow_credential: true
      rate-limit:
        count: 10
        time_window: 60
        key_type: var
        key: remote_addr

  - uri: /api/v1/auth/refresh
    upstream_id: backend
    methods: ["POST", "OPTIONS"]
    priority: 10
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "POST,OPTIONS"
        allow_headers: "Content-Type,Authorization"
        allow_credential: true

  - uri: /api/v1/auth/me
    upstream_id: backend
    methods: ["GET", "OPTIONS"]
    priority: 10
    plugins:
      cors:
        allow_origins: "*"
        allow_headers: "Content-Type,Authorization"
        allow_credential: true
      jwt-auth: {}

  - uri: /api/v1/auth/logout
    upstream_id: backend
    methods: ["POST", "OPTIONS"]
    priority: 10
    plugins:
      cors:
        allow_origins: "*"
        allow_headers: "Content-Type,Authorization"
        allow_credential: true
      jwt-auth: {}

  - uri: /api/v1/users/me
    upstream_id: backend
    methods: ["GET", "PUT", "OPTIONS"]
    priority: 10
    plugins:
      cors:
        allow_origins: "*"
        allow_headers: "Content-Type,Authorization"
        allow_credential: true
      jwt-auth: {}

  - uri: /api/v1/users/me/password
    upstream_id: backend
    methods: ["PUT", "OPTIONS"]
    priority: 10
    plugins:
      cors:
        allow_origins: "*"
        allow_headers: "Content-Type,Authorization"
        allow_credential: true
      jwt-auth: {}

  - uri: /api/v1/users/*
    upstream_id: backend
    methods: ["GET", "PATCH", "DELETE", "OPTIONS"]
    priority: 5
    plugins:
      cors:
        allow_origins: "*"
        allow_headers: "Content-Type,Authorization"
        allow_credential: true
      jwt-auth: {}

  - uri: /api/v1/materials*
    upstream_id: backend
    priority: 5
    plugins:
      cors:
        allow_origins: "*"
        allow_headers: "Content-Type,Authorization"
        allow_credential: true
      jwt-auth: {}

  - uri: /api/v1/scripts*
    upstream_id: backend
    priority: 5
    plugins:
      cors:
        allow_origins: "*"
        allow_headers: "Content-Type,Authorization"
        allow_credential: true
      jwt-auth: {}

  - uri: /api/v1/tasks*
    upstream_id: backend
    priority: 5
    plugins:
      cors:
        allow_origins: "*"
        allow_headers: "Content-Type,Authorization"
        allow_credential: true
      jwt-auth: {}

  - uri: /docs*
    upstream_id: backend
    methods: ["GET"]
    plugins:
      cors:
        allow_origins: "*"

  - uri: /openapi.json
    upstream_id: backend
    methods: ["GET"]
    plugins:
      cors:
        allow_origins: "*"
